<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow | MVP</title>
  <style>
    :root {
      --ink: #18242b;
      --muted: #6d7b80;
      --paper: #f5f7f4;
      --surface: #ffffff;
      --line: #dce5e1;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --mint: #d8f3ec;
      --coral: #e76f51;
      --amber: #d99a24;
      --shadow: 0 18px 45px rgba(28, 57, 56, .09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; overflow: hidden; }
    .topbar {
      position: relative;
      padding: 28px clamp(20px, 5vw, 76px) 86px;
      color: #f6fffb;
      background: #154b4a;
      isolation: isolate;
    }
    .topbar::after {
      content: "";
      position: absolute;
      width: 460px;
      height: 460px;
      right: -150px;
      top: -280px;
      border: 1px solid rgba(216, 243, 236, .23);
      border-radius: 50%;
      box-shadow: 0 0 0 48px rgba(216, 243, 236, .08), 0 0 0 96px rgba(216, 243, 236, .05);
      z-index: -1;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: bold; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: var(--teal-dark); background: #c9f1e6; border-radius: 10px; font-size: 20px; }
    .topbar-content { max-width: 1200px; margin: 0 auto; }
    .hero { display: flex; justify-content: space-between; align-items: end; gap: 30px; margin-top: 70px; }
    .hero h1 { max-width: 610px; margin: 0; font-size: clamp(38px, 5vw, 68px); line-height: .96; letter-spacing: -.045em; font-weight: 500; }
    .hero p { max-width: 270px; margin: 0 0 4px; color: #b8d9d2; font: 15px/1.55 Arial, sans-serif; }
    main { max-width: 1200px; margin: -42px auto 60px; padding: 0 20px; position: relative; }
    .workspace { display: grid; grid-template-columns: minmax(280px, 350px) 1fr; gap: 24px; align-items: start; }
    .panel { background: var(--surface); border: 1px solid rgba(220, 229, 225, .8); border-radius: 16px; box-shadow: var(--shadow); }
    .form-panel { padding: 26px; }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 22px; }
    h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
    .eyebrow { color: var(--teal); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 7px; color: #526268; font: 700 11px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; color: var(--ink); background: #fbfdfc; outline: none; transition: border-color .2s, box-shadow .2s; }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 9px; margin-top: 22px; }
    .btn { border: 0; border-radius: 9px; padding: 11px 15px; font: 700 13px Arial, sans-serif; transition: transform .2s, background .2s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { flex: 1; color: #fff; background: var(--teal); }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-ghost { color: var(--teal-dark); background: var(--mint); }
    .hidden { display: none !important; }
    .list-panel { min-width: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat { padding: 17px 18px; background: rgba(255, 255, 255, .78); border: 1px solid var(--line); border-radius: 12px; }
    .stat strong { display: block; margin-bottom: 5px; font-size: 29px; line-height: 1; font-weight: 500; }
    .stat span { color: var(--muted); font: 11px Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    .toolbar { display: grid; grid-template-columns: minmax(180px, 1.5fr) repeat(3, minmax(120px, 1fr)); gap: 9px; margin-bottom: 16px; }
    .search { position: relative; }
    .search input { padding-left: 36px; }
    .search::before { content: "⌕"; position: absolute; z-index: 1; left: 13px; top: 8px; color: var(--muted); font: 22px Georgia, serif; }
    .task-list { display: grid; gap: 11px; }
    .task { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; animation: appear .3s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .check { appearance: none; width: 21px; height: 21px; margin: 2px 0 0; border: 1.5px solid #a8bbb6; border-radius: 50%; background: #fff; }
    .check:checked { border-color: var(--teal); background: var(--teal); box-shadow: inset 0 0 0 4px #fff; }
    .task-title { margin: 0 0 6px; font-size: 19px; font-weight: 500; }
    .task-description { margin: 0 0 11px; color: var(--muted); font: 13px/1.45 Arial, sans-serif; white-space: pre-wrap; }
    .task.completed .task-title { color: #8a9898; text-decoration: line-through; }
    .task.completed .task-description { color: #a5b0ae; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 8px; border-radius: 5px; font: 700 10px Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    .priority-high { color: #a33e29; background: #fce4dd; }
    .priority-medium { color: #98680e; background: #fff0c9; }
    .priority-low { color: #3e7168; background: #e0f2ed; }
    .category { color: #4f5f65; background: #edf1ef; }
    .due { color: #5d6a6f; background: #f1f4f2; }
    .due.overdue { color: #a33e29; background: #fce4dd; }
    .task-actions { display: flex; gap: 4px; }
    .icon-btn { width: 31px; height: 31px; border: 0; border-radius: 7px; color: #71807f; background: transparent; font: 18px Arial, sans-serif; }
    .icon-btn:hover { color: var(--teal-dark); background: var(--mint); }
    .icon-btn.delete:hover { color: #a33e29; background: #fce4dd; }
    .empty { padding: 56px 20px; color: var(--muted); text-align: center; border: 1px dashed #c9d7d2; border-radius: 12px; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 21px; font-weight: 500; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 10; padding: 13px 17px; color: #fff; background: #183e3b; border-radius: 8px; box-shadow: var(--shadow); font: 13px Arial, sans-serif; opacity: 0; transform: translateY(12px); pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 850px) { .workspace { grid-template-columns: 1fr; } .form-panel { order: 0; } .hero { margin-top: 48px; } }
    @media (max-width: 620px) { .topbar { padding: 22px 20px 72px; } .hero { display: block; } .hero h1 { font-size: 48px; } .hero p { margin-top: 20px; } main { padding: 0 12px; } .toolbar { grid-template-columns: 1fr 1fr; } .search { grid-column: 1 / -1; } .stats { gap: 7px; } .stat { padding: 13px 10px; } .stat strong { font-size: 24px; } .task { grid-template-columns: auto 1fr; padding: 15px; } .task-actions { grid-column: 2; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-content">
        <div class="brand"><span class="brand-mark">✓</span> TaskFlow</div>
        <div class="hero">
          <h1>Haz espacio para lo que importa.</h1>
          <p>Tu centro ligero para capturar, ordenar y terminar el trabajo del día.</p>
        </div>
      </div>
    </header>

    <main>
      <div class="workspace">
        <aside class="panel form-panel">
          <div class="section-heading">
            <div><div class="eyebrow" id="form-eyebrow">Nueva tarea</div><h2 id="form-title">Añade algo pendiente</h2></div>
          </div>
          <form id="task-form">
            <div class="field"><label for="title">Título *</label><input id="title" name="title" maxlength="120" required placeholder="¿Qué necesitas hacer?"></div>
            <div class="field"><label for="description">Descripción</label><textarea id="description" name="description" maxlength="500" placeholder="Añade contexto o próximos pasos..."></textarea></div>
            <div class="split">
              <div class="field"><label for="priority">Prioridad</label><select id="priority" name="priority"><option value="3">Alta</option><option value="2" selected>Media</option><option value="1">Baja</option></select></div>
              <div class="field"><label for="due-date">Vencimiento</label><input id="due-date" name="dueDate" type="date"></div>
            </div>
            <div class="field"><label for="category">Categoría</label><input id="category" name="category" maxlength="40" placeholder="Ej. Personal, Trabajo"></div>
            <div class="actions"><button class="btn btn-primary" type="submit" id="submit-button">Crear tarea</button><button class="btn btn-ghost hidden" type="button" id="cancel-button">Cancelar</button></div>
          </form>
        </aside>

        <section class="list-panel">
          <div class="stats"><div class="stat"><strong id="total-count">0</strong><span>Total</span></div><div class="stat"><strong id="pending-count">0</strong><span>Pendientes</span></div><div class="stat"><strong id="completed-count">0</strong><span>Completadas</span></div></div>
          <div class="toolbar">
            <div class="search"><input id="search" type="search" placeholder="Buscar por título o descripción" aria-label="Buscar tareas"></div>
            <select id="status-filter" aria-label="Filtrar por estado"><option value="all">Todos los estados</option><option value="pending">Pendientes</option><option value="completed">Completadas</option></select>
            <select id="priority-filter" aria-label="Filtrar por prioridad"><option value="all">Todas las prioridades</option><option value="3">Prioridad alta</option><option value="2">Prioridad media</option><option value="1">Prioridad baja</option></select>
            <select id="category-filter" aria-label="Filtrar por categoría"><option value="all">Todas las categorías</option></select>
          </div>
          <div id="task-list" class="task-list"></div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'taskflow-mvp-tasks';
      const form = document.querySelector('#task-form');
      const taskList = document.querySelector('#task-list');
      const fields = { title: document.querySelector('#title'), description: document.querySelector('#description'), priority: document.querySelector('#priority'), dueDate: document.querySelector('#due-date'), category: document.querySelector('#category') };
      const filters = { search: document.querySelector('#search'), status: document.querySelector('#status-filter'), priority: document.querySelector('#priority-filter'), category: document.querySelector('#category-filter') };
      let tasks = readTasks();
      let editingId = null;
      let toastTimer;

      function readTasks() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
      }
      function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      function id() { return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`; }
      function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char])); }
      function priorityName(priority) { return ({ 3: 'Alta', 2: 'Media', 1: 'Baja' })[priority] || 'Media'; }
      function formatDate(value) { if (!value) return ''; return new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' }).format(new Date(`${value}T00:00:00`)); }
      function isOverdue(task) { return task.dueDate && !task.isCompleted && task.dueDate < new Date().toISOString().slice(0, 10); }
      function showToast(message) { const toast = document.querySelector('#toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }

      function render() {
        const search = filters.search.value.trim().toLowerCase();
        const visible = tasks.filter(task => {
          const textMatches = !search || `${task.title} ${task.description}`.toLowerCase().includes(search);
          const statusMatches = filters.status.value === 'all' || (filters.status.value === 'completed' ? task.isCompleted : !task.isCompleted);
          const priorityMatches = filters.priority.value === 'all' || String(task.priority) === filters.priority.value;
          const categoryMatches = filters.category.value === 'all' || task.category === filters.category.value;
          return textMatches && statusMatches && priorityMatches && categoryMatches;
        }).sort((a, b) => Number(a.isCompleted) - Number(b.isCompleted) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || b.createdAt.localeCompare(a.createdAt));

        document.querySelector('#total-count').textContent = tasks.length;
        document.querySelector('#pending-count').textContent = tasks.filter(task => !task.isCompleted).length;
        document.querySelector('#completed-count').textContent = tasks.filter(task => task.isCompleted).length;
        updateCategoryFilter();
        if (!visible.length) {
          taskList.innerHTML = `<div class="empty"><strong>${tasks.length ? 'No hay coincidencias' : 'Tu lista está despejada'}</strong><span>${tasks.length ? 'Prueba a cambiar los filtros o la búsqueda.' : 'Crea tu primera tarea para empezar a organizarte.'}</span></div>`;
          return;
        }
        taskList.innerHTML = visible.map(task => {
          const due = task.dueDate ? `<span class="pill due ${isOverdue(task) ? 'overdue' : ''}">${isOverdue(task) ? 'Vencida · ' : ''}${formatDate(task.dueDate)}</span>` : '';
          return `<article class="task ${task.isCompleted ? 'completed' : ''}">
            <input class="check" type="checkbox" ${task.isCompleted ? 'checked' : ''} data-action="toggle" data-id="${task.id}" aria-label="${task.isCompleted ? 'Reabrir' : 'Completar'} ${escapeHtml(task.title)}">
            <div><h3 class="task-title">${escapeHtml(task.title)}</h3>${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ''}<div class="meta"><span class="pill priority-${priorityName(task.priority).toLowerCase()}">${priorityName(task.priority)}</span>${task.category ? `<span class="pill category">${escapeHtml(task.category)}</span>` : ''}${due}</div></div>
            <div class="task-actions"><button class="icon-btn" type="button" data-action="edit" data-id="${task.id}" aria-label="Editar tarea" title="Editar">✎</button><button class="icon-btn delete" type="button" data-action="delete" data-id="${task.id}" aria-label="Eliminar tarea" title="Eliminar">×</button></div>
          </article>`;
        }).join('');
      }

      function updateCategoryFilter() {
        const current = filters.category.value;
        const categories = [...new Set(tasks.map(task => task.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
        filters.category.innerHTML = '<option value="all">Todas las categorías</option>' + categories.map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join('');
        filters.category.value = categories.includes(current) ? current : 'all';
      }

      function resetForm() {
        form.reset(); fields.priority.value = '2'; editingId = null;
        document.querySelector('#form-eyebrow').textContent = 'Nueva tarea'; document.querySelector('#form-title').textContent = 'Añade algo pendiente'; document.querySelector('#submit-button').textContent = 'Crear tarea'; document.querySelector('#cancel-button').classList.add('hidden');
      }
      function editTask(task) {
        editingId = task.id; fields.title.value = task.title; fields.description.value = task.description; fields.priority.value = task.priority; fields.dueDate.value = task.dueDate || ''; fields.category.value = task.category || '';
        document.querySelector('#form-eyebrow').textContent = 'Editando tarea'; document.querySelector('#form-title').textContent = 'Actualiza los detalles'; document.querySelector('#submit-button').textContent = 'Guardar cambios'; document.querySelector('#cancel-button').classList.remove('hidden'); fields.title.focus();
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const title = fields.title.value.trim();
        if (!title) { fields.title.focus(); return; }
        const now = new Date().toISOString();
        const data = { title, description: fields.description.value.trim(), priority: Number(fields.priority.value), dueDate: fields.dueDate.value, category: fields.category.value.trim() };
        if (editingId) { const task = tasks.find(item => item.id === editingId); Object.assign(task, data, { updatedAt: now }); showToast('Tarea actualizada'); }
        else { tasks.unshift({ id: id(), ...data, isCompleted: false, createdAt: now, updatedAt: now }); showToast('Tarea creada'); }
        saveTasks(); resetForm(); render();
      });
      document.querySelector('#cancel-button').addEventListener('click', resetForm);
      Object.values(filters).forEach(filter => filter.addEventListener('input', render));
      taskList.addEventListener('click', event => {
        const target = event.target.closest('[data-action]'); if (!target) return;
        const task = tasks.find(item => item.id === target.dataset.id); if (!task) return;
        if (target.dataset.action === 'edit') editTask(task);
        if (target.dataset.action === 'delete' && confirm(`¿Eliminar “${task.title}”?`)) { tasks = tasks.filter(item => item.id !== task.id); saveTasks(); render(); showToast('Tarea eliminada'); }
      });
      taskList.addEventListener('change', event => {
        if (event.target.dataset.action !== 'toggle') return;
        const task = tasks.find(item => item.id === event.target.dataset.id); if (!task) return;
        task.isCompleted = event.target.checked; task.updatedAt = new Date().toISOString(); saveTasks(); render(); showToast(task.isCompleted ? 'Tarea completada' : 'Tarea reabierta');
      });
      render();
    })();
  </script>
</body>
</html>
